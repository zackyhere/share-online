<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send File | TempShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50">
    
    <nav class="w-full py-4 px-6 flex justify-between items-center bg-white/50 backdrop-blur-sm sticky top-0 z-40 border-b border-slate-200">
        <a href="index.html" class="text-xl font-bold tracking-tight text-indigo-600">TempShare<span class="text-slate-400">.io</span></a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-3xl glass-panel p-1 rounded-3xl shadow-xl">
            
            <div class="grid grid-cols-3 gap-1 p-1 bg-slate-100/50 rounded-2xl mb-6">
                <button onclick="switchTab('txt')" id="tab-txt" class="tab-btn py-2.5 rounded-xl font-medium text-sm transition-all bg-white shadow text-indigo-600">📝 Text</button>
                <button onclick="switchTab('img')" id="tab-img" class="tab-btn py-2.5 rounded-xl font-medium text-sm transition-all text-slate-500 hover:text-slate-700">🖼️ Image</button>
                <button onclick="switchTab('file')" id="tab-file" class="tab-btn py-2.5 rounded-xl font-medium text-sm transition-all text-slate-500 hover:text-slate-700">📁 File</button>
            </div>

            <div class="p-4 md:p-8">
                
                <div id="content-txt" class="tab-content block">
                    <textarea class="w-full h-64 bg-slate-50 border border-slate-200 rounded-xl p-4 font-mono text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none" placeholder="// Paste code, notes, or secrets here..."></textarea>
                    
                    <div class="relative flex items-center py-4">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase font-bold">OR Upload .txt</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>
                    
                    <div class="drop-zone border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 hover:border-indigo-400 cursor-pointer transition-colors">
                        <p class="text-slate-500">Drag & drop .txt file here</p>
                    </div>
                </div>

                <div id="content-img" class="tab-content hidden">
                    <div class="drop-zone border-2 border-dashed border-slate-300 rounded-xl h-64 flex flex-col items-center justify-center text-center hover:bg-slate-50 hover:border-indigo-400 cursor-pointer transition-colors">
                        <svg class="w-12 h-12 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <p class="text-slate-500 font-medium">Drop image here</p>
                        <input type="file" accept="image/*" class="hidden">
                    </div>
                </div>

                <div id="content-file" class="tab-content hidden">
                    <div class="drop-zone border-2 border-dashed border-slate-300 rounded-xl h-64 flex flex-col items-center justify-center text-center hover:bg-slate-50 hover:border-indigo-400 cursor-pointer transition-colors">
                        <svg class="w-12 h-12 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="text-slate-500 font-medium">Drop any file here</p>
                        <input type="file" class="hidden">
                    </div>
                </div>

                <button class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all flex justify-center gap-2">
                    Create Temporary Link
                </button>

            </div>
        </div>
    </main>

    <script>
        function switchTab(type) {
            // Hide all contents
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('block'));
            
            // Reset Tab Styles
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-white', 'shadow', 'text-indigo-600');
                el.classList.add('text-slate-500');
            });

            // Show Active
            document.getElementById(`content-${type}`).classList.remove('hidden');
            document.getElementById(`content-${type}`).classList.add('block');
            
            // Active Tab Style
            const activeBtn = document.getElementById(`tab-${type}`);
            activeBtn.classList.remove('text-slate-500');
            activeBtn.classList.add('bg-white', 'shadow', 'text-indigo-600');
        }

        // Simple Drag and Drop Visual Feedback
        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('border-indigo-500', 'bg-indigo-50');
            });
            zone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                zone.classList.remove('border-indigo-500', 'bg-indigo-50');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('border-indigo-500', 'bg-indigo-50');
                alert('File dropped! (Backend logic would trigger here)');
            });
        });
    </script>
</body>
</html>
